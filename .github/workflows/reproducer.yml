# Builds libhdf5 from the pinned submodules -- pristine and patched, with and
# without AddressSanitizer -- builds h5py from source against each, then runs
# run-all.sh.
#
# PARALLELISM. The four library builds run in parallel steps:
#
#   lane 1  pristine plain  -> bin/vlen_minimal-<v>-plain          + .venv-<v>
#   lane 2  pristine asan   -> bin/vlen_minimal-<v>-asan
#   lane 3  patched plain   -> bin/vlen_minimal-<v>-patched-plain  + .venv-<v>-patched
#   lane 4  patched asan    -> bin/vlen_minimal-<v>-patched-asan
#
# LOGS. 
#
#   logs/environment.txt      toolchain versions and the pinned submodule commits
#   logs/lane-*.log           each build lane's make output
#   logs/cmake-*.log          cmake configure, per library build (written by the Makefile)
#   logs/build-*.log          cmake build + install, per library (ditto)
#   logs/built.txt            what existed before the reproducer ran
#   logs/run-all.txt          the results table plus the sanitizer reports
#   logs/run/<label>.log      raw stdout+stderr of one reproducer run
#
# The job summary gets the results table, and the AddressSanitizer reports
# below it in a collapsed <details> block.

name: reproducer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-all:
    name: hdf5 ${{ matrix.hdf5 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        hdf5: ["2.0.0", "2.2.0"]

    env:
      LANE_JOBS: 1

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record the pinned commits
        id: pins
        run: |
          mkdir -p logs
          {
            echo "commit:   $GITHUB_SHA"
            echo "runner:   $(uname -srm), $(nproc) cores"
            echo
            echo "submodules:"
            git submodule status
          } | tee logs/environment.txt
          echo "hdf5=$(git -C third_party/hdf5-${{ matrix.hdf5 }} rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "h5py=$(git -C third_party/h5py rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Work out how many cores each lane gets
        run: |
          jobs=$(( $(nproc) / 4 ))
          [ "$jobs" -lt 1 ] && jobs=1
          echo "LANE_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "each of the 4 lanes gets $jobs of $(nproc) cores"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential
          {
            echo
            echo "toolchain:"
            cc --version | head -1
            cmake --version | head -1
          } | tee -a logs/environment.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the Python the venvs are built with
        run: uv python install 3.14

      - name: Cache libhdf5 installs
        id: cache-prefix
        uses: actions/cache@v4
        with:
          path: prefix
          key: >-
            hdf5-${{ runner.os }}-${{ matrix.hdf5 }}-${{ steps.pins.outputs.hdf5 }}-${{
            hashFiles('Makefile', '*.patch') }}

      - name: Report whether the libraries came from cache
        run: |
          if [ "${{ steps.cache-prefix.outputs.cache-hit }}" = "true" ]; then
            echo "cache hit -- prefix/ restored; the build lanes should be no-ops"
            ls -d prefix/*/ || echo "  prefix/ is empty after all -- lanes will rebuild"
          else
            echo "cache miss -- building libhdf5 from source"
          fi

      - name: Create the git worktrees the lanes build from
        run: |
          set -o pipefail
          mkdir -p logs
          make VERSIONS=${{ matrix.hdf5 }} sources 2>&1 | tee logs/sources.log

      - name: 'Lane 1: pristine, plain -- library, binary, venv'
        id: lane-plain
        background: true
        run: |
          set -o pipefail
          mkdir -p logs
          make VERSIONS=${{ matrix.hdf5 }} JOBS=$LANE_JOBS \
               bin/vlen_minimal-${{ matrix.hdf5 }}-plain \
               .venv-${{ matrix.hdf5 }}/.built 2>&1 | tee logs/lane-plain.log

      - name: 'Lane 2: pristine, AddressSanitizer -- library, binary'
        id: lane-asan
        background: true
        run: |
          set -o pipefail
          mkdir -p logs
          make VERSIONS=${{ matrix.hdf5 }} JOBS=$LANE_JOBS \
               bin/vlen_minimal-${{ matrix.hdf5 }}-asan 2>&1 | tee logs/lane-asan.log

      - name: 'Lane 3: patched, plain -- library, binary, venv'
        id: lane-patched-plain
        background: true
        run: |
          set -o pipefail
          mkdir -p logs
          make VERSIONS=${{ matrix.hdf5 }} JOBS=$LANE_JOBS \
               bin/vlen_minimal-${{ matrix.hdf5 }}-patched-plain \
               .venv-${{ matrix.hdf5 }}-patched/.built 2>&1 | tee logs/lane-patched-plain.log

      - name: 'Lane 4: patched, AddressSanitizer -- library, binary'
        id: lane-patched-asan
        background: true
        run: |
          set -o pipefail
          mkdir -p logs
          make VERSIONS=${{ matrix.hdf5 }} JOBS=$LANE_JOBS \
               bin/vlen_minimal-${{ matrix.hdf5 }}-patched-asan 2>&1 | tee logs/lane-patched-asan.log

      - name: Join the four build lanes
        wait: [lane-plain, lane-asan, lane-patched-plain, lane-patched-asan]

      - name: Show what got built
        run: |
          {
            ls -1 bin/
            ls -d .venv-* || true
            df -h . | tail -1
          } | tee logs/built.txt

      - name: Run the reproducer against every build
        run: |
          mkdir -p logs
          rc=0
          ./run-all.sh > logs/run-all.txt 2>&1 || rc=$?
          cat logs/run-all.txt

          marker='=== sanitizer reports and failure details ==='
          {
            echo '### hdf5 ${{ matrix.hdf5 }}'
            echo '```'
            awk -v m="$marker" 'index($0, m) { exit } { print }' logs/run-all.txt
            echo '```'
            if grep -qF "$marker" logs/run-all.txt; then
              echo '<details><summary>AddressSanitizer reports and failure details</summary>'
              echo
              echo '```'
              awk -v m="$marker" 'seen; index($0, m) { seen = 1 }' logs/run-all.txt
              echo '```'
              echo
              echo '</details>'
            fi
            echo
            echo "Full logs -- cmake, build, and the raw output of every run --"
            echo "are in the \`logs-hdf5-${{ matrix.hdf5 }}\` artifact for this job."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Confirm the submodules were not modified
        if: always()
        run: |
          git submodule foreach --quiet '
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::$name was modified by the build"
              git status --short
              exit 1
            fi'
          echo "all submodules pristine"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-hdf5-${{ matrix.hdf5 }}
          path: logs/
          if-no-files-found: warn
          retention-days: 7
