# Builds libhdf5 from the pinned submodules -- pristine and patched, with and
# without AddressSanitizer -- builds h5py from source against each, then runs
# run-all.sh.
#
# run-all.sh is the assertion: every `*-patched` build must be clean and every
# pristine one must crash, and it exits non-zero otherwise. So this fails both
# if the fix stops working and if the bug quietly disappears from a pristine
# build (which would mean an unexpected library got picked up).
#
# PARALLELISM. The four library builds are independent, so they run as parallel
# background steps using the step-level `background:` / `wait:` keys
# (https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel/).
# Each lane is self-contained -- library, then the C binary, then the venv that
# needs that library -- so no lane waits on another and one `wait:` at the end
# joins them all.
#
#   lane 1  pristine plain  -> bin/vlen_minimal-<v>-plain          + .venv-<v>
#   lane 2  pristine asan   -> bin/vlen_minimal-<v>-asan
#   lane 3  patched plain   -> bin/vlen_minimal-<v>-patched-plain  + .venv-<v>-patched
#   lane 4  patched asan    -> bin/vlen_minimal-<v>-patched-asan
#
# The lanes need git worktrees -- the patched hdf5 source, and a per-venv h5py
# checkout (setuptools builds inside its source tree, so two venv builds sharing
# one checkout collide). `git worktree add` also takes a repository lock, so
# `make sources` creates them all in a serial step before the lanes start.

name: reproducer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-all:
    name: hdf5 ${{ matrix.hdf5 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        hdf5: ["2.0.0", "2.2.0"]

    env:
      LANE_JOBS: 1

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record the pinned commits
        id: pins
        run: |
          git submodule status
          echo "hdf5=$(git -C third_party/hdf5-${{ matrix.hdf5 }} rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "h5py=$(git -C third_party/h5py rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Work out how many cores each lane gets
        run: |
          jobs=$(( $(nproc) / 4 ))
          [ "$jobs" -lt 1 ] && jobs=1
          echo "LANE_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "each of the 4 lanes gets $jobs of $(nproc) cores"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the Python the venvs are built with
        run: uv python install 3.14

      # Only the installed prefixes are cached -- they are what the binaries
      # link against. The rpaths baked into them are absolute, which is fine
      # because the workspace path is stable across runs.
      #
      # On a hit this restores prefix/ and the four build lanes below become
      # no-ops: the library targets take their source tree as an ORDER-ONLY
      # prerequisite (see the Makefile), so a worktree recreated in this run
      # does not invalidate a restored library.
      #
      # Deliberately no `restore-keys`. The key is the only thing tying a cached
      # library to the commit, patch and flags that produced it; a partial-match
      # restore would hand the lanes a stale prefix that make would then treat
      # as up to date, and the job would silently test the wrong library.
      - name: Cache libhdf5 installs
        id: cache-prefix
        uses: actions/cache@v4
        with:
          path: prefix
          key: >-
            hdf5-${{ runner.os }}-${{ matrix.hdf5 }}-${{ steps.pins.outputs.hdf5 }}-${{
            hashFiles('Makefile', '*.patch') }}

      - name: Report whether the libraries came from cache
        run: |
          if [ "${{ steps.cache-prefix.outputs.cache-hit }}" = "true" ]; then
            echo "cache hit -- prefix/ restored; the build lanes should be no-ops"
            ls -d prefix/*/ || echo "  prefix/ is empty after all -- lanes will rebuild"
          else
            echo "cache miss -- building libhdf5 from source"
          fi

      # Serial on purpose -- see the note at the top of this file.
      - name: Create the git worktrees the lanes build from
        run: make VERSIONS=${{ matrix.hdf5 }} sources

      - name: 'Lane 1: pristine, plain -- library, binary, venv'
        id: lane-plain
        background: true
        run: |
          make VERSIONS=${{ matrix.hdf5 }} JOBS=$LANE_JOBS \
               bin/vlen_minimal-${{ matrix.hdf5 }}-plain \
               .venv-${{ matrix.hdf5 }}/.built

      - name: 'Lane 2: pristine, AddressSanitizer -- library, binary'
        id: lane-asan
        background: true
        run: |
          make VERSIONS=${{ matrix.hdf5 }} JOBS=$LANE_JOBS \
               bin/vlen_minimal-${{ matrix.hdf5 }}-asan

      - name: 'Lane 3: patched, plain -- library, binary, venv'
        id: lane-patched-plain
        background: true
        run: |
          make VERSIONS=${{ matrix.hdf5 }} JOBS=$LANE_JOBS \
               bin/vlen_minimal-${{ matrix.hdf5 }}-patched-plain \
               .venv-${{ matrix.hdf5 }}-patched/.built

      - name: 'Lane 4: patched, AddressSanitizer -- library, binary'
        id: lane-patched-asan
        background: true
        run: |
          make VERSIONS=${{ matrix.hdf5 }} JOBS=$LANE_JOBS \
               bin/vlen_minimal-${{ matrix.hdf5 }}-patched-asan

      - name: Join the four build lanes
        wait: [lane-plain, lane-asan, lane-patched-plain, lane-patched-asan]

      - name: Show what got built
        run: |
          ls -1 bin/
          ls -d .venv-* || true
          df -h . | tail -1

      - name: Run the reproducer against every build
        run: |
          rc=0
          ./run-all.sh > run-all.txt 2>&1 || rc=$?
          {
            echo '### hdf5 ${{ matrix.hdf5 }}'
            echo '```'
            cat run-all.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat run-all.txt
          exit $rc

      - name: Confirm the submodules were not modified
        if: always()
        run: |
          git submodule foreach --quiet '
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::$name was modified by the build"
              git status --short
              exit 1
            fi'
          echo "all submodules pristine"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-hdf5-${{ matrix.hdf5 }}
          path: |
            logs/
            run-all.txt
          if-no-files-found: warn
          retention-days: 7
